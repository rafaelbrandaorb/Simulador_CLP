<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RB Simulador PLC - Estilo TIA Portal</title>
  <style>
    :root {
      --bg-color: #1e1e1e;
      --panel-bg: #252526;
      --border-color: #3e3e42;
      --text-color: #d4d4d4;
      --accent-color: #007acc;
      --energized: #00ff66;
      --de-energized: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #333333;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.2rem;
      color: #fff;
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: #005999; }
    button.btn-run { background: #28a745; }
    button.btn-run:hover { background: #218838; }
    button.btn-stop { background: #dc3545; }
    button.btn-stop:hover { background: #c82333; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Painel Lateral / Sidebar */
    .sidebar {
      width: 240px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      user-select: none;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 5px;
    }

    .nav-item {
      padding: 10px;
      background: #2d2d30;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .nav-item:hover { background: #3e3e42; }
    .nav-item.active {
      border-color: var(--accent-color);
      background: #094771;
    }

    /* Área de Trabalho Ladder */
    .workspace {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .rung {
      display: flex;
      align-items: center;
      background: #252526;
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 6px;
      min-height: 80px;
      position: relative;
    }

    .rung-number {
      position: absolute;
      left: 6px;
      top: 6px;
      font-size: 0.75rem;
      color: #777;
    }

    .ladder-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 60px;
      height: 50px;
      border: 1px dashed #444;
      border-radius: 4px;
      margin: 0 4px;
      cursor: pointer;
      position: relative;
      background: #1e1e1e;
    }

    .ladder-cell:hover { border-color: var(--accent-color); }
    .ladder-cell.filled { border-style: solid; border-color: var(--de-energized); }
    .ladder-cell.filled.energized { border-color: var(--energized); }

    .ladder-wire {
      width: 24px;
      height: 2px;
      background-color: var(--de-energized);
      margin: 0 2px;
    }
    .ladder-wire.energized { background-color: var(--energized); }

    /* Selo / Ramificação em Paralelo Estilo TIA Portal */
    .branch-container {
      display: inline-flex;
      flex-direction: column;
      position: relative;
      padding: 0 8px;
      margin: 0 4px;
      border-left: 3px solid var(--de-energized);
      border-right: 3px solid var(--de-energized);
      transition: border-color 0.15s;
      cursor: pointer;
      background: #181818;
      border-radius: 4px;
    }

    .branch-container.energized {
      border-color: var(--energized);
    }

    .branch-row {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      position: relative;
      padding: 4px 0;
    }

    .branch-divider {
      width: 100%;
      height: 1px;
      background: #333;
      margin: 2px 0;
    }

    .contact-na { font-weight: bold; font-size: 1.2rem; color: #aaa; }
    .contact-nf { font-weight: bold; font-size: 1.2rem; color: #aaa; }
    .coil { font-weight: bold; font-size: 1.1rem; color: #aaa; }
    .tag-name { font-size: 0.75rem; color: #4ec9b0; margin-top: 2px; }

    .energized .contact-na,
    .energized .contact-nf,
    .energized .coil {
      color: var(--energized);
    }

    .ton-box {
      font-size: 0.75rem;
      text-align: center;
      border: 1px solid var(--de-energized);
      padding: 2px 5px;
      border-radius: 3px;
    }
    .energized .ton-box { border-color: var(--energized); color: var(--energized); }

    /* Painel E/S (Entradas e Saídas) */
    .io-panel {
      width: 260px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .io-panel h3 { font-size: 0.85rem; text-transform: uppercase; color: #888; }

    .io-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .io-btn {
      padding: 8px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .io-btn.active {
      background: #008000;
      border-color: var(--energized);
      box-shadow: 0 0 8px rgba(0,255,102,0.4);
    }

    .io-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
    }
    .io-btn.active .io-indicator { background: var(--energized); }
  </style>
</head>
<body>

  <header>
    <h1>RB SIMULADOR PLC — TIA Portal Style</h1>
    <div class="header-btns">
      <button class="btn-run" onclick="toggleSimulation()">▶ Iniciar Simulação</button>
      <button onclick="addRung()">+ Nova Linha</button>
      <button onclick="clearLadder()" style="background:#666;">Limpar Tudo</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Barra de Ferramentas -->
    <div class="sidebar">
      <div class="nav-section">
        <h3>Instruções Ladder</h3>
        <div class="nav-item tool" data-tool="na" id="tool-na">|| Contato NA</div>
        <div class="nav-item tool" data-tool="nf" id="tool-nf">|/| Contato NF</div>
        <div class="nav-item tool" data-tool="selo" id="tool-selo">🔀 Inserir Selo (TIA Portal)</div>
        <div class="nav-item tool" data-tool="coil" id="tool-coil">( ) Bobina</div>
        <div class="nav-item tool" data-tool="ton" id="tool-ton">⏱ Temporizador TON</div>
        <div class="nav-item tool" data-tool="wire" id="tool-wire">― Conector (Linha)</div>
        <div class="nav-item tool" data-tool="del" id="tool-del" style="color: #ff6666;">❌ Apagar Item</div>
      </div>
    </div>

    <!-- Área da Diagramação Ladder -->
    <div class="workspace" id="rungsArea"></div>

    <!-- Monitoramento E/S -->
    <div class="io-panel">
      <h3>Entradas Digitais (I)</h3>
      <div class="io-grid" id="inputsGrid"></div>

      <h3 style="margin-top: 15px;">Saídas Digitais (Q)</h3>
      <div class="io-grid" id="outputsGrid"></div>
    </div>
  </div>

  <script>
    // Estado Global do PLC
    const PLC = {
      running: false,
      memory: {},
      T: {
        '1': { acc: 0, preset: 2000, done: false, _power: false },
        '2': { acc: 0, preset: 2000, done: false, _power: false }
      },
      get(tag) {
        return !!this.memory[tag];
      },
      set(tag, val) {
        this.memory[tag] = !!val;
      }
    };

    let rungs = [];
    let selectedTool = null;
    let timerInterval = null;

    // Inicialização da interface de Entradas/Saídas
    function initIO() {
      const inGrid = document.getElementById('inputsGrid');
      const outGrid = document.getElementById('outputsGrid');
      inGrid.innerHTML = '';
      outGrid.innerHTML = '';

      for (let i = 0; i < 8; i++) {
        const tag = `I0.${i}`;
        inGrid.innerHTML += `
          <button class="io-btn" id="btn-${tag}" onclick="toggleInput('${tag}')">
            ${tag} <span class="io-indicator"></span>
          </button>`;
      }

      for (let i = 0; i < 8; i++) {
        const tag = `Q0.${i}`;
        outGrid.innerHTML += `
          <div class="io-btn" id="btn-${tag}" style="cursor:default;">
            ${tag} <span class="io-indicator"></span>
          </div>`;
      }
    }

    function toggleInput(tag) {
      PLC.set(tag, !PLC.get(tag));
      updateIOVisuals();
      if (PLC.running) runCycle();
    }

    function updateIOVisuals() {
      for (let i = 0; i < 8; i++) {
        const inTag = `I0.${i}`;
        const btnIn = document.getElementById(`btn-${inTag}`);
        if (btnIn) btnIn.classList.toggle('active', PLC.get(inTag));

        const outTag = `Q0.${i}`;
        const btnOut = document.getElementById(`btn-${outTag}`);
        if (btnOut) btnOut.classList.toggle('active', PLC.get(outTag));
      }
    }

    // Seleção de Ferramenta
    document.querySelectorAll('.tool').forEach(btn => {
      btn.addEventListener('click', () => {
        const tool = btn.getAttribute('data-tool');
        selectedTool = selectedTool === tool ? null : tool;
        updateToolHighlight();
      });
    });

    function updateToolHighlight() {
      document.querySelectorAll('.tool').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tool') === selectedTool);
      });
    }

    function addRung() {
      rungs.push({ cells: [] });
      renderLadder();
    }

    function clearLadder() {
      if (confirm('Deseja realmente apagar todo o programa?')) {
        rungs = [];
        renderLadder();
      }
    }

    // Avaliação individual de elementos
    function evalElement(cell, powerIn) {
      if (!cell || !cell.type) return false;
      if (cell.type === 'na') return powerIn && PLC.get(cell.tag);
      if (cell.type === 'nf') return powerIn && !PLC.get(cell.tag);
      return false;
    }

    // Processamento do Scan do PLC
    function processRungs() {
      rungs.forEach(rung => {
        let power = true;
        rung.cells.forEach(cell => {
          cell.energized = false;
          if (!cell.type) return;

          // Processa Ramificação em Paralelo (Selo)
          if (cell.type === 'branch') {
            const topPower = evalElement(cell.top, power);
            if (cell.top) cell.top.energized = topPower;

            const bottomPower = evalElement(cell.bottom, power);
            if (cell.bottom) cell.bottom.energized = bottomPower;

            // Transmite energia se o caminho superior OU inferior for conduzido
            power = topPower || bottomPower;
            cell.energized = power;
          } 
          else if (cell.type === 'na') {
            power = power && PLC.get(cell.tag);
            cell.energized = power;
          } 
          else if (cell.type === 'nf') {
            power = power && !PLC.get(cell.tag);
            cell.energized = power;
          } 
          else if (cell.type === 'wire') {
            cell.energized = power;
          } 
          else if (cell.type === 'coil') {
            PLC.set(cell.tag, power);
            cell.energized = power;
          } 
          else if (cell.type === 'ton') {
            const tNum = cell.tag.replace('T','');
            if (PLC.T[tNum]) {
              PLC.T[tNum]._power = power;
              PLC.T[tNum].preset = cell.preset || 2000;
              cell.energized = PLC.T[tNum].done;
            }
          }
        });
      });
    }

    // Atualização dos Temporizadores TON
    function updateTimers(dt) {
      Object.keys(PLC.T).forEach(k => {
        const timer = PLC.T[k];
        if (timer._power) {
          if (timer.acc < timer.preset) {
            timer.acc += dt;
            if (timer.acc >= timer.preset) {
              timer.acc = timer.preset;
              timer.done = true;
            }
          }
        } else {
          timer.acc = 0;
          timer.done = false;
        }
      });
    }

    function runCycle() {
      processRungs();
      updateIOVisuals();
      renderLadder();
    }

    function toggleSimulation() {
      PLC.running = !PLC.running;
      const btn = document.querySelector('.btn-run');

      if (PLC.running) {
        btn.textContent = '⏹ Parar Simulação';
        btn.className = 'btn-stop';
        timerInterval = setInterval(() => {
          updateTimers(100);
          runCycle();
        }, 100);
      } else {
        btn.textContent = '▶ Iniciar Simulação';
        btn.className = 'btn-run';
        clearInterval(timerInterval);
        runCycle();
      }
    }

    // Renderização Visual da Linguagem Ladder
    function renderLadder() {
      const area = document.getElementById('rungsArea');
      if (rungs.length === 0) {
        area.innerHTML = `<div style="padding:40px; color:#777; text-align:center;">
          Clique no botão <strong>"+ Nova Linha"</strong> acima para montar seu circuito Ladder!
        </div>`;
        return;
      }

      area.innerHTML = '';

      rungs.forEach((rung, rIdx) => {
        const div = document.createElement('div');
        div.className = 'rung';
        div.innerHTML = `<span class="rung-number">RUNG ${rIdx+1}</span>`;

        rung.cells.forEach((cell, cIdx) => {
          const e = PLC.running && cell.energized;

          if (cell.type === 'wire') {
            div.innerHTML += `<div class="ladder-wire ${e ? 'energized' : ''}"></div>`;
            return;
          }

          // Bloco do Selo Paralelo estilo TIA Portal
          if (cell.type === 'branch') {
            const topE = PLC.running && cell.top?.energized;
            const botE = PLC.running && cell.bottom?.energized;

            div.innerHTML += `
              <div class="branch-container ${e ? 'energized' : ''}" onclick="cellClick(${rIdx}, ${cIdx})">
                <div class="branch-row">
                  <div class="ladder-cell filled ${topE ? 'energized' : ''}">
                    <span class="contact-na">||</span>
                    <span class="tag-name">${cell.top ? cell.top.tag : 'S/TAG'}</span>
                  </div>
                </div>
                <div class="branch-divider"></div>
                <div class="branch-row">
                  <div class="ladder-cell filled ${botE ? 'energized' : ''}">
                    <span class="contact-na">||</span>
                    <span class="tag-name">${cell.bottom ? cell.bottom.tag : 'S/TAG'}</span>
                  </div>
                </div>
              </div>`;
            return;
          }

          let content = '';
          switch (cell.type) {
            case 'na':
              content = `<span class="contact-na">||</span><span class="tag-name">${cell.tag}</span>`;
              break;
            case 'nf':
              content = `<span class="contact-nf">|/|</span><span class="tag-name">${cell.tag}</span>`;
              break;
            case 'coil':
              content = `<div class="coil ${e ? 'energized' : ''}">( )</div><span class="tag-name">${cell.tag}</span>`;
              break;
            case 'ton':
              const tNum = cell.tag.replace('T','');
              const t = PLC.T[tNum] || {acc:0, preset:cell.preset};
              content = `<div class="ton-box">TON<br><small>${cell.tag}</small><br>${Math.round(t.acc)}/${cell.preset}ms</div>`;
              break;
            default:
              content = '<span style="color:#555;">+</span>';
          }

          div.innerHTML += `
            <div class="ladder-cell ${cell.type ? 'filled' : ''} ${e ? 'energized' : ''}" 
                 onclick="cellClick(${rIdx}, ${cIdx})">
              ${content}
            </div>`;
        });

        div.innerHTML += `
          <div class="ladder-cell" onclick="cellClick(${rIdx}, ${rung.cells.length})">+</div>`;
        area.appendChild(div);
      });
    }

    // Clique e Adição de Componentes na Célula
    function cellClick(r, c) {
      const rung = rungs[r];
      if (!rung) return;

      // Inserção do Selo em Paralelo
      if (selectedTool === 'selo') {
        const tagTop = prompt('TAG do Contato Principal (Botão LIGA):\nEx: I0.0', 'I0.0');
        if (!tagTop) { selectedTool = null; updateToolHighlight(); return; }

        const tagBottom = prompt('TAG do Contato do Selo (Saída Paralela):\nEx: Q0.0', 'Q0.0');
        if (!tagBottom) { selectedTool = null; updateToolHighlight(); return; }

        const branchCell = {
          type: 'branch',
          top: { type: 'na', tag: tagTop.toUpperCase() },
          bottom: { type: 'na', tag: tagBottom.toUpperCase() }
        };

        rung.cells.splice(c, 0, branchCell);
        rung.cells.splice(c + 1, 0, { type: 'wire' });

        selectedTool = null;
        updateToolHighlight();
        renderLadder();
        return;
      }

      // Remover item
      if (selectedTool === 'del') {
        if (rung.cells[c]) rung.cells.splice(c, 1);
        selectedTool = null;
        updateToolHighlight();
        renderLadder();
        return;
      }

      // Inserir Conector (Linha)
      if (selectedTool === 'wire') {
        rung.cells.splice(c, 0, { type: 'wire' });
        renderLadder();
        return;
      }

      // Inserir Contatos, Bobinas e Timers
      if (selectedTool && ['na','nf','coil','ton'].includes(selectedTool)) {
        const tag = prompt('Digite a TAG do dispositivo:\nEx: I0.0, Q0.0, M0.0, T1');
        if (!tag) { selectedTool = null; updateToolHighlight(); return; }

        const newCell = { type: selectedTool, tag: tag.toUpperCase() };
        if (selectedTool === 'ton') {
          const t = prompt('Tempo em milissegundos (Ex: 2000 = 2s):', 2000);
          newCell.preset = parseInt(t) || 2000;
        }

        rung.cells.splice(c, 0, newCell);
        rung.cells.splice(c + 1, 0, { type: 'wire' });

        selectedTool = null;
        updateToolHighlight();
        renderLadder();
        return;
      }
    }

    // Inicialização ao carregar a página
    initIO();
    addRung();
  </script>
</body>
</html>
