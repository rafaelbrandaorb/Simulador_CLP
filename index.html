<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIA Portal Web - Editor CLP & IHM</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #1e1e1e; color: #dcdcdc; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; }
    
    /* CABEÇALHO TIA PORTAL */
    .header { background: #2d2d2d; border-bottom: 2px solid #009999; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.1rem; color: #009999; margin: 0; }
    .tabs { display: flex; gap: 5px; }
    .tab-btn { background: #3c3c3c; color: #aaa; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px 4px 0 0; font-weight: bold; }
    .tab-btn.active { background: #009999; color: #fff; }

    /* ÁREA PRINCIPAL */
    .workspace { flex: 1; background: #252526; border: 1px solid #3c3c3c; overflow-y: auto; padding: 15px; display: none; }
    .workspace.active { display: block; }

    /* TOOLBAR DE COMANDOS */
    .toolbar { background: #333; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tool-btn { background: #007acc; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 0.85rem; }
    .tool-btn:hover { background: #005999; }

    /* LADDER editor */
    .rung { background: #181818; border: 1px solid #444; border-radius: 4px; padding: 15px; margin-bottom: 10px; position: relative; }
    .rung-line { display: flex; align-items: center; min-height: 60px; overflow-x: auto; padding: 10px 0; }
    .rail { width: 4px; height: 60px; background-color: #009999; flex-shrink: 0; }
    .wire { height: 3px; background-color: #666; width: 30px; flex-shrink: 0; }
    .wire.active { background-color: #00ff00; }
    
    .elem-block { display: flex; align-items: center; cursor: pointer; background: #2d2d2d; border: 1px dashed #666; border-radius: 4px; padding: 5px; margin: 0 2px; }
    .elem-block.active { border-color: #00ff00; color: #00ff00; }
    .elem-tag { font-size: 0.75rem; color: #ff9900; display: block; text-align: center; }

    /* IHM CANVAS & BUILDER */
    .hmi-screen { width: 100%; height: 350px; background: #111; border: 2px solid #555; position: relative; overflow: hidden; border-radius: 4px; }
    .hmi-obj { position: absolute; padding: 8px; background: #333; border: 1px solid #888; border-radius: 4px; cursor: move; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .hmi-btn { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .hmi-led { width: 30px; height: 30px; border-radius: 50%; background: #444; border: 1px solid #666; }
    .hmi-led.active { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
    .hmi-img { max-width: 60px; max-height: 60px; }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <div class="header">
    <h1>TIA Portal Web Studio</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('ladder')">Lógica Ladder (OB1)</button>
      <button class="tab-btn" onclick="switchTab('hmi')">IHM (WinCC)</button>
    </div>
  </div>

  <!-- ABA LADDER -->
  <div id="tab-ladder" class="workspace active">
    <div class="toolbar">
      <button class="tool-btn" onclick="addContact('NO')">+ Contato NA (-| |-)</button>
      <button class="tool-btn" onclick="addContact('NC')">+ Contato NF (-|/|-)</button>
      <button class="tool-btn" onclick="addCoil()">+ Bobina (-( ))</button>
      <button class="tool-btn" style="background:#dc3545;" onclick="clearLadder()">Limpar Network</button>
    </div>

    <div class="rung">
      <span style="color:#aaa; font-size:0.8rem;">Network 1: Lógica Principal</span>
      <div class="rung-line" id="ladder-rung">
        <div class="rail"></div>
        <div class="wire" id="wire-start"></div>
        <!-- Elementos serão inseridos dinamicamente aqui -->
        <div id="ladder-elements" style="display:flex; align-items:center;"></div>
        <div class="wire" id="wire-end"></div>
        <div class="rail"></div>
      </div>
    </div>
  </div>

  <!-- ABA IHM -->
  <div id="tab-hmi" class="workspace">
    <div class="toolbar">
      <button class="tool-btn" onclick="addHmiObject('button')">+ Adicionar Botão</button>
      <button class="tool-btn" onclick="addHmiObject('led')">+ Adicionar Indicador LED</button>
      <button class="tool-btn" onclick="addHmiObject('image')">+ Adicionar Imagem/Símbolo</button>
    </div>

    <div class="hmi-screen" id="hmi-screen">
      <!-- Objetos da IHM serão renderizados aqui -->
    </div>
  </div>

<script>
  // ESTADO DA MEMÓRIA DO CLP
  const plcMemory = {
    I0_0: false,
    I0_1: false,
    Q0_0: false
  };

  // ESTRUTURA DA LÓGICA
  let ladderElements = [
    { type: 'NO', tag: 'I0_0' },
    { type: 'NC', tag: 'I0_1' },
    { type: 'COIL', tag: 'Q0_0' }
  ];

  // OBJETOS DA IHM
  let hmiObjects = [
    { id: 1, type: 'button', label: 'LIGA', tag: 'I0_0', x: 20, y: 20 },
    { id: 2, type: 'button', label: 'DESLIGA', tag: 'I0_1', x: 120, y: 20 },
    { id: 3, type: 'led', tag: 'Q0_0', x: 70, y: 100 }
  ];

  // NAVEGAÇÃO ENTRE ABAS
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.workspace').forEach(w => w.classList.remove('active'));
    
    if(tab === 'ladder') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-ladder').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-hmi').classList.add('active');
      renderHMI();
    }
  }

  // GERENCIADOR LADDER
  function renderLadder() {
    const container = document.getElementById('ladder-elements');
    container.innerHTML = '';

    ladderElements.forEach((el, idx) => {
      const div = document.createElement('div');
      div.className = 'elem-block';
      
      let symbol = '-| |-';
      if(el.type === 'NC') symbol = '-|/|-';
      if(el.type === 'COIL') symbol = '-( )-';

      div.innerHTML = `
        <div>
          <span class="elem-tag">%${el.tag}</span>
          <strong onclick="editTag(${idx})">${symbol}</strong>
        </div>
      `;
      
      if((el.type === 'NO' && plcMemory[el.tag]) || 
         (el.type === 'NC' && !plcMemory[el.tag]) ||
         (el.type === 'COIL' && plcMemory[el.tag])) {
        div.classList.add('active');
      }

      container.appendChild(div);

      const wire = document.createElement('div');
      wire.className = 'wire';
      container.appendChild(wire);
    });
  }

  function addContact(type) {
    const tag = prompt("Informe a Tag (%I0.0, %I0.1, %Q0.0):", "I0.0").replace('%','');
    ladderElements.push({ type, tag });
    renderLadder();
  }

  function addCoil() {
    const tag = prompt("Informe a Tag da Bobina (%Q0.0):", "Q0.0").replace('%','');
    ladderElements.push({ type: 'COIL', tag });
    renderLadder();
  }

  function editTag(index) {
    const newTag = prompt("Altere a Tag do componente:", ladderElements[index].tag);
    if(newTag) ladderElements[index].tag = newTag.replace('%','');
    renderLadder();
  }

  function clearLadder() {
    ladderElements = [];
    renderLadder();
  }

  // GERENCIADOR IHM
  function renderHMI() {
    const screen = document.getElementById('hmi-screen');
    screen.innerHTML = '';

    hmiObjects.forEach(obj => {
      const div = document.createElement('div');
      div.className = 'hmi-obj';
      div.style.left = obj.x + 'px';
      div.style.top = obj.y + 'px';

      if(obj.type === 'button') {
        div.innerHTML = `<button class="hmi-btn" 
          onmousedown="plcMemory['${obj.tag}']=true" 
          onmouseup="plcMemory['${obj.tag}']=false"
          ontouchstart="plcMemory['${obj.tag}']=true" 
          ontouchend="plcMemory['${obj.tag}']=false">
          ${obj.label} (%${obj.tag})
        </button>`;
      } else if(obj.type === 'led') {
        const isActive = plcMemory[obj.tag] ? 'active' : '';
        div.innerHTML = `<span style="font-size:0.7rem;">%${obj.tag}</span><div class="hmi-led ${isActive}"></div>`;
      } else if(obj.type === 'image') {
        div.innerHTML = `<img src="${obj.url}" class="hmi-img" alt="IHM Symbol"/>`;
      }

      screen.appendChild(div);
    });
  }

  function addHmiObject(type) {
    if(type === 'button') {
      const label = prompt("Texto do Botão:", "LIGA");
      const tag = prompt("Tag associada ao Botão:", "I0.0").replace('%','');
      hmiObjects.push({ id: Date.now(), type: 'button', label, tag, x: 50, y: 50 });
    } else if(type === 'led') {
      const tag = prompt("Tag associada ao LED:", "Q0.0").replace('%','');
      hmiObjects.push({ id: Date.now(), type: 'led', tag, x: 50, y: 150 });
    } else if(type === 'image') {
      const url = prompt("URL da Imagem/Ícone Industrial:", "https://cdn-icons-png.flaticon.com/512/3652/3652191.png");
      if(url) hmiObjects.push({ id: Date.now(), type: 'image', url, x: 100, y: 100 });
    }
    renderHMI();
  }

  // CICLO DE SCAN DO CLP (EXECUÇÃO)
  function plcScan() {
    // Avalia a sequência de contatos em série
    let powerRail = true;

    ladderElements.forEach(el => {
      if(el.type === 'NO') {
        powerRail = powerRail && Boolean(plcMemory[el.tag]);
      } else if(el.type === 'NC') {
        powerRail = powerRail && !Boolean(plcMemory[el.tag]);
      } else if(el.type === 'COIL') {
        plcMemory[el.tag] = powerRail;
      }
    });

    renderLadder();
    if(document.getElementById('tab-hmi').classList.contains('active')) {
      renderHMI();
    }
  }

  // Iniciar a aplicação
  renderLadder();
  setInterval(plcScan, 100);
</script>

</body>
</html>
