<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador CLP + IHM Web</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaeaea;
    }

    #container {
      display: flex;
      height: 100vh;
    }

    #ladder-panel, #ihm-panel {
      flex: 1;
      padding: 10px;
      box-sizing: border-box;
    }

    #ladder-panel {
      border-right: 1px solid #ccc;
      background: #f5f5f5;
    }

    #ihm-panel {
      background: #ffffff;
    }

    h2 {
      margin-top: 0;
    }

    #ladder-toolbar, #ihm-toolbar {
      margin-bottom: 10px;
    }

    #ladder-canvas, #ihm-canvas {
      border: 1px solid #aaa;
      height: calc(100% - 80px);
      position: relative;
      background: #fafafa;
    }

    .block, .ihm-element {
      position: absolute;
      padding: 5px 10px;
      border: 1px solid #333;
      background: #fff;
      cursor: move;
      user-select: none;
      font-size: 12px;
    }

    .led {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #333;
    }

    #trend {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 250px;
      height: 150px;
      border: 1px solid #333;
      background: #fff;
    }

    #trend canvas {
      width: 100%;
      height: 100%;
    }

    #alarm-panel {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 250px;
      height: 150px;
      border: 1px solid #333;
      background: #fff;
      font-size: 12px;
      overflow-y: auto;
      padding: 5px;
      box-sizing: border-box;
    }

    #alarm-panel h3 {
      margin: 0 0 5px 0;
      font-size: 13px;
    }

    .alarm {
      padding: 2px 0;
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- Painel Ladder -->
    <div id="ladder-panel">
      <h2>Ladder (Simulado)</h2>
      <div id="ladder-toolbar">
        <button data-block="na">Contato NA (START)</button>
        <button data-block="nf">Contato NF (STOP)</button>
        <button data-block="coil">Bobina (MOTOR)</button>
        <button id="btn-ton">TON (3s)</button>
        <button id="btn-ctu">CTU (5)</button>
      </div>
      <div id="ladder-canvas"></div>
    </div>

    <!-- Painel IHM -->
    <div id="ihm-panel">
      <h2>IHM</h2>
      <div id="ihm-toolbar">
        <button data-ihm="button">Botão START</button>
        <button data-ihm="led">LED MOTOR</button>
        <button data-ihm="motor">Motor</button>
        <button data-ihm="analog">Valor Analógico TEMP</button>
      </div>
      <div id="ihm-canvas">
        <div id="trend">
          <canvas id="trendCanvas"></canvas>
        </div>
        <div id="alarm-panel">
          <h3>Alarmes</h3>
          <div id="alarm-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -----------------------------
    // CLP SIMULADO (TAGS + BLOCO TON + CTU)
    // -----------------------------
    const plc = {
      START: false,
      STOP: false,
      MOTOR: false,
      TEMP: 25.0,
      TON_Q: false,
      CTU_CV: 0,
      CTU_Q: false
    };

    // TON simples (3s)
    const ton = {
      in: false,
      q: false,
      pt: 3000,
      elapsed: 0
    };

    function tonUpdate(cycleMs) {
      if (ton.in) {
        ton.elapsed += cycleMs;
        if (ton.elapsed >= ton.pt) ton.q = true;
      } else {
        ton.elapsed = 0;
        ton.q = false;
      }
      plc.TON_Q = ton.q;
    }

    // CTU simples (preset 5)
    const ctu = {
      cu: false,
      prevCu: false,
      cv: 0,
      pv: 5,
      q: false
    };

    function ctuUpdate() {
      if (ctu.cu && !ctu.prevCu) {
        ctu.cv++;
        if (ctu.cv >= ctu.pv) ctu.q = true;
      }
      ctu.prevCu = ctu.cu;
      plc.CTU_CV = ctu.cv;
      plc.CTU_Q = ctu.q;
    }

    // -----------------------------
    // ELEMENTOS VISUAIS
    // -----------------------------
    const ladderCanvas = document.getElementById('ladder-canvas');
    const ihmCanvas = document.getElementById('ihm-canvas');

    document.getElementById('ladder-toolbar').addEventListener('click', e => {
      const type = e.target.dataset.block;
      if (!type) return;
      createLadderBlock(type);
    });

    document.getElementById('ihm-toolbar').addEventListener('click', e => {
      const type = e.target.dataset.ihm;
      if (!type) return;
      createIhmElement(type);
    });

    document.getElementById('btn-ton').addEventListener('click', () => {
      alert('TON está sendo usado na lógica: START aciona TON de 3s antes de MOTOR.');
    });

    document.getElementById('btn-ctu').addEventListener('click', () => {
      alert('CTU conta quantas vezes START foi pressionado (preset 5).');
    });

    function createLadderBlock(type) {
      const div = document.createElement('div');
      div.classList.add('block');
      div.style.left = '50px';
      div.style.top = (50 + ladderCanvas.children.length * 50) + 'px';

      if (type === 'na') {
        div.textContent = 'NA START';
        div.dataset.kind = 'na';
        div.dataset.tag = 'START';
      } else if (type === 'nf') {
        div.textContent = 'NF STOP';
        div.dataset.kind = 'nf';
        div.dataset.tag = 'STOP';
      } else if (type === 'coil') {
        div.textContent = 'COIL MOTOR (TON_Q && CTU_Q)';
        div.dataset.kind = 'coil';
        div.dataset.tag = 'MOTOR';
      }

      makeDraggable(div);
      ladderCanvas.appendChild(div);
    }

    function createIhmElement(type) {
      if (type === 'button') {
        const btn = document.createElement('button');
        btn.classList.add('ihm-element');
        btn.textContent = 'START';
        btn.style.left = '50px';
        btn.style.top = '50px';

        makeDraggable(btn);

        btn.onmousedown = () => {
          plc.START = true;
          ctu.cu = true;
        };
        btn.onmouseup = () => {
          plc.START = false;
          ctu.cu = false;
        };

        ihmCanvas.appendChild(btn);
      } else if (type === 'led') {
        const led = document.createElement('div');
        led.classList.add('ihm-element', 'led');
        led.style.left = '150px';
        led.style.top = '50px';
        led.dataset.tag = 'MOTOR';

        makeDraggable(led);
        ihmCanvas.appendChild(led);

        setInterval(() => {
          led.style.background = plc.MOTOR ? 'green' : 'red';
        }, 100);
      } else if (type === 'motor') {
        const motor = document.createElement('div');
        motor.classList.add('ihm-element');
        motor.textContent = 'Motor / Esteira';
        motor.style.left = '50px';
        motor.style.top = '120px';

        makeDraggable(motor);
        ihmCanvas.appendChild(motor);

        setInterval(() => {
          motor.style.background = plc.MOTOR ? '#c0ffc0' : '#ffc0c0';
        }, 100);
      } else if (type === 'analog') {
        const label = document.createElement('div');
        label.classList.add('ihm-element');
        label.style.left = '50px';
        label.style.top = '190px';

        makeDraggable(label);
        ihmCanvas.appendChild(label);

        setInterval(() => {
          label.textContent = 'TEMP: ' + plc.TEMP.toFixed(1) + ' °C';
        }, 200);
      }
    }

    // Drag básico
    function makeDraggable(el) {
      let offsetX = 0, offsetY = 0, dragging = false;

      el.addEventListener('mousedown', e => {
        dragging = true;
        offsetX = e.offsetX;
        offsetY = e.offsetY;
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const rect = el.parentElement.getBoundingClientRect();
        el.style.left = (e.clientX - rect.left - offsetX) + 'px';
        el.style.top = (e.clientY - rect.top - offsetY) + 'px';
      });

      document.addEventListener('mouseup', () => dragging = false);
    }

    // -----------------------------
    // MOTOR DE LÓGICA DO CLP
    // -----------------------------
    setInterval(() => {
      // Contatos
      const na = plc.START;      // NA START
      const nf = !plc.STOP;      // NF STOP

      // TON: entrada é START
      ton.in = na;
      tonUpdate(100);

      // CTU: já está sendo atualizado pelo botão
      ctuUpdate();

      // Bobina MOTOR: só liga se TON_Q e CTU_Q forem verdadeiros
      plc.MOTOR = ton.q && ctu.q;

      // Simulação de TEMP subindo quando MOTOR liga
      if (plc.MOTOR) {
        plc.TEMP += 0.1;
      } else {
        plc.TEMP -= 0.05;
      }
      if (plc.TEMP < 20) plc.TEMP = 20;
      if (plc.TEMP > 80) plc.TEMP = 80;

      // Alarmes
      checkAlarms();
    }, 100);

    // -----------------------------
    // GRÁFICO DE TENDÊNCIA (TEMP)
    // -----------------------------
    const trendCanvas = document.getElementById('trendCanvas');
    const ctx = trendCanvas.getContext('2d');
    const trendData = [];

    function updateTrend() {
      trendData.push(plc.TEMP);
      if (trendData.length > 100) trendData.shift();

      const w = trendCanvas.width;
      const h = trendCanvas.height;

      ctx.clearRect(0, 0, w, h);
      ctx.beginPath();
      ctx.strokeStyle = 'blue';

      trendData.forEach((val, i) => {
        const x = (i / 100) * w;
        const y = h - ((val - 20) / 60) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      ctx.stroke();
    }

    setInterval(updateTrend, 200);

    // -----------------------------
    // ALARMES
    // -----------------------------
    const alarmList = document.getElementById('alarm-list');

    function addAlarm(text) {
      const div = document.createElement('div');
      div.classList.add('alarm');
      div.textContent = new Date().toLocaleTimeString() + ' - ' + text;
      alarmList.appendChild(div);
      alarmList.scrollTop = alarmList.scrollHeight;
    }

    function checkAlarms() {
      if (plc.TEMP > 70) {
        addAlarm('Alarme: TEMP alta (>70 °C)');
      }
      if (plc.CTU_Q) {
        addAlarm('CTU atingiu preset (5 ciclos de START)');
        // evita repetir infinito
        ctu.q = false;
      }
    }
  </script>
</body>
</html>
